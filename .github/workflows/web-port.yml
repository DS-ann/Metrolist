name: Metrolist Web

on:
  push:
    branches: [web-port]
  pull_request:
    branches: [web-port]

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  build-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/server/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: |
          PORT=8787 node dist/index.js > /tmp/metrolist-server.log 2>&1 &
          echo $! > /tmp/metrolist-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/metrolist-server.log
          exit 1

services:
  - type: web
    name: metrolist-web
    runtime: node
    plan: free
    rootDir: web/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: WEB_ORIGIN
        value: https://metrolist-web.onrender.com
